<style>
html.ami-loading [data-ami-public-block]:not(:has(
  [data-ami-annex-mounted="fallback"],[data-ami-volume-fallback]:not([hidden]),
  [data-ami-webnode-fallback]:not([hidden]),[data-index-fallback]:not([hidden])
)) > .ami-lecture-directe {display:none}
html.ami-loading [data-ami-public-block] > [data-ami-webnode-anchor]:has(>[role="status"]):not(:has(>[data-ami-webnode-fallback]:not([hidden])))::before {
  content:"Chargement Protocole aMi";display:block;padding:2rem 1rem;
  color:#ffd06a;background:#101018;text-align:center;font:600 1rem/1.5 system-ui,sans-serif
}
</style>
<script>
(() => {
  const root = document.documentElement;
  if (root.classList.contains('ami-loading')) return;
  root.classList.add('ami-loading');
  // Older Webnode blocks sometimes fail before their adapter can show a fallback.
  setTimeout(() => root.classList.remove('ami-loading'), 28000);
})();
</script>

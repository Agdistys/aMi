  <script>(async () => {
  const holder = document.currentScript.parentElement;

  function selectors(value) {
    const parts = [];
    let start = 0, depth = 0, quote = '';
    for (let i = 0; i < value.length; i++) {
      const c = value[i];
      if (c === '\\') { i++; continue; }
      if (quote) { if (c === quote) quote = ''; continue; }
      if (c === '"' || c === "'") quote = c;
      else if (c === '(' || c === '[') depth++;
      else if (c === ')' || c === ']') depth--;
      else if (c === ',' && depth === 0) { parts.push(value.slice(start, i).trim()); start = i + 1; }
    }
    parts.push(value.slice(start).trim());
    return parts;
  }

  function scoped(selector) {
    selector = selector.replace(/^html\s+body(?=\s|[.#:[>+~]|$)/, 'body');
    const root = selector.match(/^(:root|html|body)(?=$|[ .#:[>+~])(.*)$/);
    if (!root) return scope + ' ' + selector;
    const tail = root[2];
    if (!tail || /^[\s>+~]/.test(tail)) return scope + tail;
    const state = tail.match(/^\.(lecture|contraste|passe-[\w-]+|ami-[\w-]+)(?=[\s>+~]|$)/);
    if (state) return root[1] + state[0] + ' ' + scope + tail.slice(state[0].length);
    return scope + tail;
  }

  function isolate(css) {
    const sheet = new CSSStyleSheet();
    // Les shorthands avec var() perdent leur valeur dans CSSOM quand un longhand diffère.
    const source = css.replace(/background\s*:\s*((?:linear-gradient\([^;{}]*var\([^;{}]*|var\(--or-metal\)))(?=;\s*(?:-webkit-)?background-(?:clip|size|position|repeat)\s*:)/g, 'background-image:$1');
    sheet.replaceSync(source);
    function render(rule) {
      if (rule.type === CSSRule.STYLE_RULE) return selectors(rule.selectorText).map(scoped).join(',') + '{' + rule.style.cssText + '}';
      if (rule.cssRules && [4, 12].includes(rule.type)) return rule.cssText.slice(0, rule.cssText.indexOf('{')) + '{' + Array.from(rule.cssRules, render).join('\n') + '}';
      return rule.cssText;
    }
    return Array.from(sheet.cssRules, render).join('\n');
  }

  function addClosers(root) {

        label.append(...kicker.childNodes);

        title.append(label,' ');

      title.append(...heading.childNodes);
      heading.append(title);
      summary.append(heading);
      body.append(...response.childNodes);
      detail.append(summary,body);

      response.classList.add('ami-response-folded','ami-response-folded-webnode');
    }

    for (const style of fragment.querySelectorAll('style')) style.textContent = isolate(style.textContent);
    for (const item of fragment.querySelectorAll('[href],[src],[poster],[action]')) {

    const scripts = [...fragment.querySelectorAll('script')].filter(script => !script.type || /^(text|application)\/javascript$/i.test(script.type) || script.type === 'module');
    if (scripts.some(script => script.src)) throw Error('Le volume contient un script externe à vérifier.');

    for (let box = host.parentElement; box && box !== document.body; box = box.parentElement) {
      const css = getComputedStyle(box);
      if (css.overflowX === 'hidden') box.style.overflowX = 'clip';
      if (css.overflowY === 'hidden') box.style.overflowY = 'visible';
    }
    const downloads = new Set(cfg.downloads);
    host.addEventListener('click', event => {
      const control = event.target.closest('button[id],a[id]');
      if (!control || !downloads.has(control.id)) return;
      event.preventDefault();
      event.stopPropagation();
      const url = URL.createObjectURL(new Blob([bytes], { type:'text/html;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = expected.pathname.split('/').pop();
      host.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    }, true);
    for (const old of scripts) {
      if (!old.isConnected) continue;
      const script = document.createElement('script');
      for (const attr of old.attributes) script.setAttribute(attr.name, attr.value);
      script.textContent = old.textContent;
      old.replaceWith(script);
    }
    const controls = Object.fromEntries(Object.entries(cfg.controls || {}).map(([name, ids]) => [name, ids.map(id => host.querySelector('#' + CSS.escape(id))).find(Boolean)]));
    for (const [key, control] of Object.entries(controls)) if (control) host.dataset['amiHas' + key[0].toUpperCase() + key.slice(1)] = '';
    const search = controls.search;
    if (search) document.addEventListener('keydown', event => {
      if (!(event.metaKey || event.ctrlKey) || event.key.toLowerCase() !== 'f') return;
      event.preventDefault();
      event.stopImmediatePropagation();
      search.click();
    }, true);

    const progress = document.createElement('div');
    progress.dataset.amiNativeProgress = '';
    progress.setAttribute('role','progressbar');
    progress.setAttribute('aria-label','Progression de lecture');
    progress.setAttribute('aria-valuemin','0');
    progress.setAttribute('aria-valuemax','100');
    const fill = progress.appendChild(document.createElement('span'));
    const clamp = value => Math.max(0,Math.min(1,value));
    let frame = 0;
    function measure() {

      const fullscreen = document.fullscreenElement || document.webkitFullscreenElement || host.querySelector('.ami-faux-fs');
      const active = fullscreen && host.contains(fullscreen) ? fullscreen : null;
      const owner = active || host;
      if (progress.parentElement !== owner) owner.prepend(progress);
      const site = document.querySelector('.h-w.h-f.wnd-fixed');
      const offset = active ? 0 : Math.max(0,site?.getBoundingClientRect().bottom || 0);
      progress.style.setProperty('--ami-native-progress-top',offset+'px');
      const bounds = root.getBoundingClientRect();
      const span = active ? active.scrollHeight - active.clientHeight : bounds.height - (document.documentElement.clientHeight - offset);
      const ratio = clamp(span > 0 ? (active ? active.scrollTop : offset - bounds.top) / span : (bounds.bottom <= innerHeight ? 1 : 0));
      fill.style.transform = 'scaleX('+ratio+')';
      progress.setAttribute('aria-valuenow',String(Math.round(ratio*100)));
    }
    function schedule() { if (!frame) frame = requestAnimationFrame(measure); }
    host.addEventListener('scroll',schedule,true);
    window.addEventListener('scroll',schedule,{passive:true});
    window.addEventListener('resize',schedule);
    document.addEventListener('fullscreenchange',schedule);

    new MutationObserver(schedule).observe(root,{attributes:true,attributeFilter:['class']});
    addClosers(root);
    schedule();

    function fitVolumeHeadlines(root) {
  const doc = root.ownerDocument;
  const view = doc.defaultView;
  const canvas = doc.createElement('canvas');
  const context = canvas.getContext('2d');
  if (!context) return;
  const wordWidth = (word, font) => {
    const count = Array.from(word).length;
    return context.measureText(word).width + Math.max(0,count - 1) * (Number.parseFloat(font.letterSpacing) || 0);
  };
  const originalSize = new WeakMap();
  function fit() {
    const titles = [...root.querySelectorAll('h1,.apok-word')];
    for (const title of titles) {
      if (!title.hasAttribute('data-ami-headline-fit')) continue;
      title.removeAttribute('data-ami-headline-fit');
      const old = originalSize.get(title);
      if (old.value) title.style.setProperty('font-size',old.value,old.priority);
      else title.style.removeProperty('font-size');
    }
    const targets = [];
    for (const title of titles) {
      if (title.matches('.e12-sr,.sr-only,.visually-hidden') || !title.offsetWidth) continue;
      const parentWidth = title.parentElement.clientWidth;
      const outerWidth = root.clientWidth;
      const limit = Math.min(title.clientWidth || parentWidth, parentWidth || title.clientWidth, outerWidth || Infinity);
      if (limit < 80) continue;
      const font = view.getComputedStyle(title);
      context.font = [font.fontStyle,font.fontWeight,font.fontSize,font.fontFamily].join(' ');
      const words = [...title.childNodes].filter(node => node.nodeType === 3 || (node.nodeType === 1 && !['block','flex','grid'].includes(view.getComputedStyle(node).display))).map(node => node.textContent).join('').trim().split(/\s+/);
      if (words.length === 1 && !words[0]) continue;
      const widest = Math.max(...words.map(word => wordWidth(font.textTransform === 'uppercase' ? word.toUpperCase() : word,font)));
      if (widest > limit) targets.push([title,Math.floor(Number.parseFloat(font.fontSize) * (limit-1) / widest * 10) / 10]);
    }
    for (const [title,size] of targets) {
      originalSize.set(title,{value:title.style.getPropertyValue('font-size'),priority:title.style.getPropertyPriority('font-size')});
      title.style.setProperty('font-size',size+'px','important');
      title.dataset.amiHeadlineFit = '';
    }
  }
  let frame = 0;
  function schedule() {
    if (!frame) frame = view.requestAnimationFrame(() => {frame = 0;fit();});
  }
  view.addEventListener('resize',schedule,{passive:true});
  doc.fonts?.ready.then(schedule);
  schedule();
}
    fitVolumeHeadlines(host);
  } catch (error) {
    if (host.isConnected) host.replaceWith(holder);
    status.textContent = 'Ce volume n’a pas pu être affiché dans la page.';
    holder.querySelector('[data-ami-volume-fallback]').hidden = false;
    console.error('Volume aMi', error);
  }
})();
